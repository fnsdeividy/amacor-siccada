{% extends "window.html" %}

{% block window_content %}
<!DOCTYPE html>
<html lang="en">
    <h1>Anexar documentos da proposta</h1>
    <form action="{{ url_for('cad.adicionar_doc', proposta=proposta) }}" method="POST" enctype="multipart/form-data">
        <label for="arquivos">Selecione os documentos para upload:</label>
        <input type="file" name="arquivos" id="arquivos" multiple required>
        <button type="submit">Enviar</button>
    </form>
    <p style="margin-top: 12px;">
        <a href="{{ url_for('cad.listar_documentos_contrato', proposta=proposta) }}">Visualizar arquivos enviados desta proposta</a>
    </p>
</body>
</html>
</div>
</div>

<script>
    function goBack() {
        if (document.referrer) {
            // Voltar para a página anterior
            window.history.back();
        } else {
            // Redirecionar para a home se não houver página anterior
            window.location.href = '/';
        }
    }
</script>
        {% endblock %}
