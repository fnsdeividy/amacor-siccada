{% extends "window.html" %}

{% block title %}Filtragem de Contratos{% endblock %}

{% block window_content %}
        <h1>
            Filtragem de Contratos
        </h1>

        
        <form method="GET" action="{{ url_for('gerencial.relatorio_vendas') }}" class="filter-form">
            <label for ="status">Status da proposta:</label>
            <select name="status" id="status">
                <option value="" disabled selected>Selecione</option>
                <option value="Enviado ao cadastro">enviado ao cadastro</option>
                <option value="entrevista online enviada">entrevista online enviada</option>
                <option value="enviado para financeiro">Enviar para financeiro</option>
                <option value="nota emitida">nota emitida</option>
               <option value="analise de declaração">Enviar para analise</option>
                <option value="entrevista agendada">entrevista Agendada</option>
                <option value="geração de kit">gerar kit</option>
                <option value="contrato finalizado">contrato finalizado</option>
            </select>
            
            <label for="data_inicio" class="input-label">Data de Início:</label>
            <input type="date" id="data_inicio" name="venda_inicial" class="date-input">
        
            <label for="data_fim" class="input-label">Data de Fim:</label>
            <input type="date" id="data_fim" name="venda_final" class="date-input">
        
            <button type="submit" class="btn btn-primary">Redirecionar</button>
        </form>
    </div>
</div>  
{% endblock %}
