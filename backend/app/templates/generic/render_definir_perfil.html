{% extends "window.html" %}
{% block title %}Gerar Proposta{% endblock %}
{% block window_content %}


        <h1>
            Definir uma nova foto de perfil para:   <div style="color:rgb(47, 130, 141)"><strong>{{nome_usuario}}</strong><div>
        </h1>
        <p>Selecione a mída para ser sua nova foto de perfil</p>
        <br><br>
        <form action="{{ url_for('generic.definir_perfil') }}" method="POST" enctype="multipart/form-data">
            <label for="arquivos">Selecione o documento para upload:</label>
            <input type="file" name="arquivos" id="arquivos" required><br><br>
            <button class="btn" type="submit">Enviar</button>
        </form>


{% endblock %}
