# Blueprint do Render: Postgres + back (privado, com disco) + front (público).
# Passo a passo do deploy e da migração dos dados: DEPLOY.md

databases:
  - name: siccada-db
    databaseName: amacor
    user: amacor
    region: virginia
    postgresMajorVersion: "16"
    plan: basic-256mb

services:
  # Back: Flask/gunicorn. Serviço privado: só o front (rede interna do Render)
  # chega nele, então as telas HTML antigas não ficam expostas na internet.
  - type: pserv
    name: siccada-backend
    runtime: docker
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # disco para os arquivos que o sistema grava (uploads, comprovantes,
    # kits, fotos de perfil, logs); veja backend/docker-entrypoint.sh
    disk:
      name: siccada-arquivos
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siccada-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # endereço público do sistema (para o QR code da entrevista), ex.:
      # https://siccada.onrender.com
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_REMETENTE
        value: alertaamacor.siccada@gmail.com
      - key: SMTP_SENHA_APP
        sync: false
      - key: RAPIDOC_TOKEN
        sync: false
      - key: RAPIDOC_CLIENT_ID
        sync: false
      - key: KOMMO_CLIENT_ID
        sync: false
      - key: KOMMO_ACCESS_TOKEN
        sync: false

  # Front: build do React servido pelo nginx, que repassa /api e /static ao back
  - type: web
    name: siccada
    runtime: docker
    region: virginia
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: siccada-backend
          property: hostport
