{% extends "base1.html" %}
{% block title %}Editar Contrato{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/tabpix.css') }}">

<div class="container-tab-pix">
    <div class="filter-tab-pix2">
        <a class="close-btn" href="{{ url_for('cad.detalhes_cnt',proposta=proposta) }}"class="close-btn"><</a>
    </div>

    <h1 class="table-title-tab-pix">Editar Contrato</h1>
        <a id = 'btn_vendas'class="btn" href=" {{ url_for('cad.alterar_infos_proposta', proposta=proposta,tp_alt='venda') }} ">alterar vendas</a>
        <label for="btn_vendas">Para realizar alterações em dados da venda(valores, data, etc)</label>
        <br>
        <a id = 'btn_resp'class="btn" href=" {{ url_for('cad.alterar_infos_proposta', proposta=proposta,tp_alt='respp') }} ">alterar responsavel</a>
        <label for="btn_resp">Para realizar alterações em dados do responsavel (nome, cpf, cnpj, etc)</label>
        <br>
        <a id ='btn_tilt' class="btn" href=" {{ url_for('cad.alterar_infos_proposta', proposta=proposta,tp_alt='titular') }} ">alterar titular</a>
        <label for="btn_tilt">Para realizar alterações em dados do titular (nome, cpf, etc)</label>
        <br>
        <a class="btn" href=" {{ url_for('cad.alterar_infos_proposta', proposta=proposta,tp_alt='depenn') }} ">alterar dependentes</a>
        <label for="btn_tilt">Para realizar alterações em dados do dependente (nome, cpf, etc)</label>
        <br><br>
        <a class="btn" href="{{ url_for('cad.excluir_proposta', proposta=proposta, tp_alt='cancelar') }}">Cancelar venda</a>
        <label for="btn_tilt">Para cancelar a venda, mantendo os dados para futuras consultas</label>
        <br>
        <a class="btn" href="{{ url_for('cad.excluir_proposta', proposta=proposta, tp_alt='excluir') }}">Excluir proposta</a>
        <label for="btn_tilt">Para excluir completamente a proposta e todos os dados associados</label>
        <br><br>
</div>

<script>
    function goBack() {
        if (document.referrer) {
            // Voltar para a página anterior
            window.history.back();
        } else {
            // Redirecionar para a home se não houver página anterior
            window.location.href = '/';
        }
    }
</script>
{% endblock %}
