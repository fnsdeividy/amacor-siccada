<script>

function calcularValorTotal() {
    let total = 0;
    
    // Valor do titular
    const valorTitular = document.getElementById('valor_titular').value;
    if (valorTitular && valorTitular.includes('R$')) {
        const valorNumerico = parseFloat(valorTitular.replace('R$ ', '').replace(',', '.'));
        if (!isNaN(valorNumerico)) {
            total += valorNumerico;
        }
    }
    
    // Valores dos dependentes
    document.querySelectorAll('.valor-dependente').forEach(campo => {
        const valorDependente = campo.value;
        if (valorDependente && valorDependente.includes('R$')) {
            const valorNumerico = parseFloat(valorDependente.replace('R$ ', '').replace(',', '.'));
            if (!isNaN(valorNumerico)) {
                total += valorNumerico;
            }
        }
    });
    
    // Atualizar o campo de valor da venda
    document.getElementById('valor_venda').value = total > 0 ? `R$ ${total.toFixed(2)}` : '';
    console.log('Valor total calculado:', total);
}

function showTab(index) {
    const sections = document.querySelectorAll('.form-section');
    const tabs = document.querySelectorAll('.tab');
    sections.forEach((section, i) => {
        section.classList.toggle('active', i === index);
    });
    tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
    });
}

        document.getElementById('dt_nascimento_beneficiario').value = responsavelDtNascimento;
        document.getElementById('endereco_beneficiario').value = responsavelEndereco;
        document.getElementById('celular_titular').value = responsavelCelular;
        document.getElementById('email_titular').value = responsavelEmail;

        document.getElementById('email_titular').value = '';
        document.getElementById('estado_cv_beneficiario').value = '';
    }
}

// Função para calcular idade
function calcularIdade(dataNascimento) {
    if (!dataNascimento) return '';
    const hoje = new Date();
    const nascimento = new Date(dataNascimento);
    let idade = hoje.getFullYear() - nascimento.getFullYear();
    const m = hoje.getMonth() - nascimento.getMonth();
    if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
    }
    return idade;
}

// Função para buscar preço usando POST
async function buscarPreco(idade, plano) {
    console.log('Buscando preço para:', idade, plano);
    if (!idade || !plano) {
        return null;
    }

    try {
        // CORREÇÃO: Adicionar /vendas/ antes da rota
        const response = await fetch(`/vendas/preco/idade/${idade}/${encodeURIComponent(plano)}`, {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
            }
        });
        
        console.log('Resposta status:', response.status);
        
        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Dados recebidos:', data);
        return data.preco !== undefined ? data.preco : null;
        
    } catch (error) {
        console.error('Erro ao buscar preço:', error);
        return null;
    }
}

// Na função testarRotaPreco também:
async function testarRotaPreco() {
    console.log('Testando rota de preço...');
    try {
        const response = await fetch('/vendas/preco/idade/30/Amacor%20Exclusivo%20II', {

        const data = await response.json();
        console.log('Resposta:', data);
        return data;
    } catch (error) {
        console.error('Erro no teste:', error);
    }
}

// Função para calcular idade e buscar preço para o TITULAR
async function calcularIdadeEBuscarPrecoTitular() {
    console.log('Calculando idade titular...');
    const idade = calcularIdade(document.getElementById('dt_nascimento_beneficiario').value);
    console.log('Idade titular:', idade);
    document.getElementById('idade_beneficiario').value = idade;
    
    const plano = document.getElementById("tipo_produto").value;
    console.log('Plano selecionado:', plano);
    
    if (!idade || !plano) return;

    const preco = await buscarPreco(idade, plano);
    if (preco !== null) {
        document.getElementById("valor_titular").value = `R$ ${parseFloat(preco).toFixed(2)}`;
    } else {
        document.getElementById("valor_titular").value = 'Preço não encontrado';
    }
    
    // Calcular valor total após atualizar o titular
    calcularValorTotal();
}

async function calcularIdadeEBuscarPrecoDependente(campoData) {
    console.log('Calculando idade dependente...');
    const dependenteDiv = campoData.closest('.dependente');
    const campoIdade = dependenteDiv.querySelector('.idade-dependente');
    const campoValor = dependenteDiv.querySelector('.valor-dependente');
    
    const idade = calcularIdade(campoData.value);
    console.log('Idade dependente:', idade);
    campoIdade.value = idade;

    const plano = document.getElementById("tipo_produto").value;
    console.log('Plano selecionado:', plano);
    
    if (!idade || !plano) {
        campoValor.value = '';
        return;
    }

    const preco = await buscarPreco(idade, plano);
    if (preco !== null) {
        campoValor.value = `R$ ${parseFloat(preco).toFixed(2)}`;
    } else {
        campoValor.value = 'Preço não encontrado';
    }
    
    // Calcular valor total após atualizar o dependente
    calcularValorTotal();
}

// Função para buscar CEP do responsável
function buscarCepResponsavel() {
    const cepInput = document.getElementById('cep_responsavel');
    const cep = cepInput.value.replace(/\D/g, '');
    if (cep.length === 8) {
        fetch('{{ url_for('vendas.buscar_endereco_cep') }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cep: cep })
        })
        .then(response => response.json())
        .then(data => {
            if (!data.erro) {
                document.getElementById('endereco_responsavel').value =
                    `${data.logradouro || ''}, ${data.bairro || ''}, ${data.localidade || ''} - ${data.uf || ''}`.replace(/^, |, ,/g, '').trim();
            }
        });
    }
}

// Event listeners quando a página carrega
document.addEventListener('DOMContentLoaded', function() {
    console.log('Página carregada, configurando event listeners...');
    
    // Event listener para o titular
    const dtNascimentoTitular = document.getElementById('dt_nascimento_beneficiario');
    if (dtNascimentoTitular) {
        dtNascimentoTitular.addEventListener('change', calcularIdadeEBuscarPrecoTitular);
        console.log('Event listener do titular configurado');
    }
    
    // Event listener para quando mudar o plano
    const tipoProduto = document.getElementById('tipo_produto');
    if (tipoProduto) {
        tipoProduto.addEventListener('change', function() {
            console.log('Plano alterado para:', this.value);
            // Recalcular preço do titular se já tiver idade
            const idadeTitular = document.getElementById('idade_beneficiario').value;
            if (idadeTitular) {
                calcularIdadeEBuscarPrecoTitular();
            }
            
            // Recalcular para dependentes
            document.querySelectorAll('.data-nascimento-dependente').forEach(campo => {
                if (campo.value) {
                    calcularIdadeEBuscarPrecoDependente(campo);
                }
            });
        });
        console.log('Event listener do plano configurado');
    }

    // Event listener para CEP
    document.getElementById('cep_responsavel').addEventListener('blur', buscarCepResponsavel);
    document.getElementById('btn-buscar-cep').addEventListener('click', buscarCepResponsavel);
});

                    <br><br>
                    <label for="taxa_adesao">Com taxa de adesao?</label>
                    <select id="taxa_adesao" name="taxa_adesao" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="sim">Sim</option>
                        <option value="nao">Nao</option>
                    </select>
                </div>
                

                <div class="nav-buttons">
                    <button type="button" onclick="showTab(2)">Voltar</button>

                </div>
            </div>
        </form>
    </div>
</div>

<script>
// Event listeners quando a página carrega
document.addEventListener('DOMContentLoaded', function() {
    // Event listener para o titular - usando POST
    document.getElementById('dt_nascimento_beneficiario').addEventListener('change', calcularIdadeEBuscarPrecoTitular);
    
    // Event listener para quando mudar o plano - recalcula preços
    document.getElementById('tipo_produto').addEventListener('change', function() {
        // Recalcular preço do titular se já tiver idade
        const idadeTitular = document.getElementById('idade_beneficiario').value;
        if (idadeTitular) {
            calcularIdadeEBuscarPrecoTitular();
        }
        
        // Recalcular para dependentes
        document.querySelectorAll('.data-nascimento-dependente').forEach(campo => {
            if (campo.value) {
                calcularIdadeEBuscarPrecoDependente(campo);
            }
        });
    });

    // Event listener para CEP
    document.getElementById('cep_responsavel').addEventListener('blur', buscarCepResponsavel);
    document.getElementById('btn-buscar-cep').addEventListener('click', buscarCepResponsavel);
});

// Função para debug - teste a rota
async function testarRotaPreco() {
    try {
        const response = await fetch('/vendas/preco/idade/30/Amacor%20Exclusivo%20II', {
            method: "POST",
            headers: {
                'Content-Type': 'application/json',
            }
        });
        console.log('Status:', response.status);
        const data = await response.json();
        console.log('Resposta:', data);
    } catch (error) {
        console.error('Erro no teste:', error);
    }
}
</script>
{% endblock %}
