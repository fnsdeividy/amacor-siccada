{% extends "window.html" %}
{% block title %}Gerar Proposta{% endblock %}
{% block window_content %}


        <h1>
            Enviar foto para perfil
        </h1>
        <p>Selecione a mída para ser sua nova foto de perfil</p>
        <br><br>
        <form action="{{ url_for('doc_gen.upload_documento') }}" method="POST" enctype="multipart/form-data">
            <label for="arquivos">Selecione os documentos para upload:</label>
            <input type="file" name="arquivos" id="arquivos" required>
            <button type="submit">Enviar</button>
        </form>


{% endblock %}
