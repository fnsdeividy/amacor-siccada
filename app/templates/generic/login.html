<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos_login.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icone.ico') }}">
    <title>Siccada - login</title>
    <style>
       .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px;
            background-color: #4caf50;
            color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: none;
            font-size: 16px;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        .alert.error { background-color: #f44336; }
        .alert.warning { background-color: #ff9800; }
        .alert.info { background-color: #2196f3; }
    </style>
</head>
<body class="login-body">
    <div id="flash-message" class="alert"></div>
    <div class="divisoria">
        <h1>Siccada</h1>
        <h2>Login</h2>
        <form action="{{ url_for('auth.login') }}" method="POST">
            <br><label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required><br><br>
            <button type="submit" class="envia" id="login-btn">Entrar</button>
        </form>
    </div>
    <script>
        // Capturar mensagens flash do Flask
        const flashMessages = {{ get_flashed_messages() | tojson | safe }};
        const flashContainer = document.getElementById('flash-message');
        if (flashMessages.length > 0) {
            flashContainer.textContent = flashMessages[0];
            flashContainer.style.display = 'block';
            setTimeout(() => {
                flashContainer.style.display = 'none';
            }, 5000);
        }
        // Loader animado no botão (opcional)
        document.querySelector('form').addEventListener('submit', function() {
            document.getElementById('login-btn').classList.add('sending');
        });
    </script>
</body>
</html>
