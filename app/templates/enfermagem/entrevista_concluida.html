

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevista Concluída</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .confirmation-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .success-icon {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
            animation: bounce 1s ease-out;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        .title {
            color: #2E7D32;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .patient-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid #667eea;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-weight: 500;
        }
        
        .info-value {
            color: #333;
            font-weight: 600;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn-confirm {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-confirm:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .timestamp {
            color: #888;
            font-size: 0.9rem;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 576px) {
            .confirmation-card {
                padding: 30px 20px;
            }
            
            .success-icon {
                font-size: 60px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .info-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-card">
        <!-- Ícone de sucesso -->
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <!-- Título e subtítulo -->
        <h1 class="title">Entrevista Concluída!</h1>
        <p class="subtitle">O questionário de saúde foi registrado com sucesso.</p>
        
        <!-- Informações do paciente -->
        
        
        <!-- Mensagem de confirmação -->
        <div class="alert alert-success" role="alert">
            <i class="fas fa-check me-2"></i>
            Todas as informações foram salvas no sistema. O paciente está apto para continuar o processo.
        </div>
        
        <!-- Botões de ação -->
        <div class="actions">
            <a href="/enfermagem/declaracao?cpf={{ dados.cpf }}" class="btn-confirm btn-primary" target="_blank">
                <i class="fas fa-file-medical"></i> Visualizar Declaração
            </a>
            
            <a href="/enfermagem/gerar_qrcode?cpf={{ dados.cpf }}" class="btn-confirm btn-success" target="_blank">
                <i class="fas fa-qrcode"></i> Gerar QR Code
            </a>
            
            <a href="/" class="btn-confirm btn-secondary">
                <i class="fas fa-home"></i> Voltar ao Início
            </a>
        </div>
        
        <!-- Timestamp -->
        <div class="timestamp">
            <i class="far fa-clock me-2"></i>
            Concluído em: {{ timestamp }}
        </div>
    </div>

    <script>
        // Adiciona animação aos botões
        document.querySelectorAll('.btn-confirm').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'translateY(0)';
            });
        });
        
        // Adiciona data/hora atual
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const timestampElement = document.querySelector('.timestamp');
            if (timestampElement && !timestampElement.textContent.includes('{{ timestamp }}')) {
                const formattedTime = now.toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                timestampElement.innerHTML = `<i class="far fa-clock me-2"></i>Concluído em: ${formattedTime}`;
            }
        });
    </script>
</body>
</html>
