{% extends "window.html" %}

{% block window_content %}

<h1 class="titulo-pagamento">Mudar status de boleto emitido</h1>

<form method="POST" class="form-pagamento" action="{{ url_for('finan.cancelar_boleto') }}">
    
    <div class="info-pagamento">
        <p><strong>Número de Contrato:</strong> {{ dados[0] }}</p>
        <p><strong>Responsável:</strong> {{ dados[2] }}</p>
        
        <p><strong>Data de Cancelamento:</strong> {{ dados[7] }}</p>
        
        <p><strong>Motivo:</strong> {{ dados[8] }}</p>
    </div>

    <div class="campo-status">
        <label for="status"><strong>Status:</strong></label>
        <select id="status" name="status" required>
            <option value="" selected disabled>Selecione</option>  
            <option value="1">Cancelado</option>            
        </select>
    </div>
    <input type="hidden" name="numero_contrato" value={{dados[0]}}>
    <input type="hidden" name="data_inicial" value={{data_inicial}}>
    <input type="hidden" name="data_final" value={{data_final}}>
    <div class="acoes-form">
        <button class="btn" type="submit">Salvar</button>
        
    </div>
</form>
<style>
.titulo-pagamento {
    text-align: center;
    margin-bottom: 25px;
    font-size: 1.6em;
    letter-spacing: 0.5px;
}

.form-pagamento {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.info-pagamento p {
    margin: 4px 0;
    font-size: 1em;
    line-height: 1.4;
}

.campo-status {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

select {
    padding: 8px 10px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
}

.acoes-form {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.btn,
.btn-cancela {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s ease;
}

.btn:hover,
.btn-cancela:hover {
    transform: scale(1.05);
}
</style>
{% endblock %}
