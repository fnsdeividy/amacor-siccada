{% extends "window.html" %}

{% block title %}Envia CPT{% endblock %}

{% block window_content %}
    <h1>Upload de Documento</h1>
    <form action="{{ url_for('doc_gen.render_cpt') }}" method="POST" enctype="multipart/form-data">
        <label for="arquivo">Selecione os documentos para upload:</label>
        <input type="file" name="arquivo" id="arquivo" required>
        <button type="submit">Enviar</button>
    </form>
{% endblock %}
