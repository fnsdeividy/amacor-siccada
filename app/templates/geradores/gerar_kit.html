{% extends 'base1.html' %}

{% block title %}Gerar Kit{% endblock %}
{% block content %}
<div class="container">
  <div class="divisoria2">
    <div class="close-btn-container">
      <a href="{{ url_for('auth.fechar') }}" class="close-btn">✖</a>
    </div>
    <h1>Gerar Kit</h1>
    <h2>Gerando Kit para o contrato: {{dados.numero_contrato}}</h2>
    <div>
      <form id="form-gerar-kit" action="{{ url_for('doc_gen.gerar_documentos') }}" method="POST">
        <label for="numero_contrato">Número do Contrato:</label>
        <input type="text" id="numero_contrato" name="numero_contrato" value="{{ dados.numero_contrato }}"required >
        <label for="nome_responsavel">Nome do Responsável:</label>
        <input type="text" id="nome_responsavel" name="nome_responsavel" value="{{ dados.nome_responsavel }}"required>
        <label for="plano_nome">Nome do plano</label>
        <select id="plano_nome" name="plano_nome" required>
          <option value="{{dados.tipo_produto}}">{{dados.tipo_produto}}</option>
        
          <option value="Amacor Exclusivo I" >AMACOR EXCLUSIVO I</option>
          <option value="Amacor Exclusivo II" >AMACOR EXCLUSIVO II</option>
          <option value="AMACOR EXCLUSIVO II EMPRESARIAL">Exclusivo II Empresarial</option>
          <option value="AMACOR CLASSICO EMPRESARIAL">Classico Empresarial</option>
        </select>
        <br>
        <label for="data_contrato">Data do Contrato:</label>
        <input type="date" name="data_venda" value="{{ dados.data_venda | format_date_iso }}" required>
        <br>
        <br>
        <br>
        <button class="btn" type="submit">Gerar Documento</button>
      </form>
    </div>
  </div>
</div>
<script>
document.getElementById('form-gerar-kit').addEventListener('submit', function() {
    document.getElementById('loader').style.display = 'flex';
});
</script>
{% endblock %}
