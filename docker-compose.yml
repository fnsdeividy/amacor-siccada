services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amacor
      POSTGRES_PASSWORD: amacor
      POSTGRES_DB: amacor
      # ordenação de texto byte a byte, igual ao SQLite (só vale ao criar o banco)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amacor -d amacor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://amacor:amacor@postgres:5432/amacor
    ports:
      - "8001:8001"
    volumes:
      - ./backend/static:/app/static
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
