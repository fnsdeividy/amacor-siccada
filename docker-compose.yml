services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amacor
      POSTGRES_PASSWORD: amacor
      POSTGRES_DB: amacor
      # ordenação de texto byte a byte, igual ao SQLite (só vale ao criar o banco)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amacor -d amacor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # desenvolvimento: servidor do Flask, que recarrega a cada alteração
    # (a imagem, como em produção, roda gunicorn)
    command: python run.py
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://amacor:amacor@postgres:5432/amacor
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    ports:
      - "8001:8001"
    volumes:
      # código montado: em desenvolvimento o Flask recarrega a cada alteração
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # front já compilado (como em produção). Em desenvolvimento use o Vite:
  #   npm --prefix frontend run dev   ->  http://localhost:5173
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
